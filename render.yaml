# Render Blueprint — deploys the backend API + the manager dashboard together.
# In Render: New → Blueprint → pick this repo. Then fill the values marked "sync: false".
services:
  # ---- Backend API (Node + Express) ----
  - type: web
    name: prosales-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL      # paste your Neon connection string
        sync: false
      - key: JWT_SECRET        # Render generates a strong random value
        generateValue: true
      - key: CORS_ORIGIN       # set to the dashboard URL once known (or * to start)
        sync: false
      - key: NODE_VERSION
        value: "20"

  # ---- Manager dashboard (static React build) ----
  - type: web
    name: prosales-dashboard
    runtime: static
    rootDir: web-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL      # set to https://<backend-url>/api after the backend deploys
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
